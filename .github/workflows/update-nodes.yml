name: 更新 FlClash 节点

on:
  workflow_dispatch:
    inputs:
      subscription_url:
        description: "粘贴当天的 Clash 订阅链接"
        required: true
        default: "https://shz.al/fyxm"
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 获取仓库内容
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 YAML 检查工具
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: 下载当天 Clash 配置
        env:
          SUBSCRIPTION_URL: ${{ inputs.subscription_url }}
        run: |
          echo "正在下载当天配置"

          curl \
            --location \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 180 \
            --user-agent "Mozilla/5.0" \
            "$SUBSCRIPTION_URL" \
            --output flclash-temp.yaml

      - name: 检查下载结果
        run: |
          if [ ! -s flclash-temp.yaml ]; then
            echo "下载失败：文件为空"
            exit 1
          fi

          FILE_SIZE=$(wc -c < flclash-temp.yaml)
          echo "下载文件大小：$FILE_SIZE 字节"

          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "下载失败：文件内容过少"
            exit 1
          fi

          if ! grep -qE '^[[:space:]]*(proxies|proxy-providers):' flclash-temp.yaml; then
            echo "下载内容可能不是 Clash 配置"
            head -n 20 flclash-temp.yaml
            exit 1
          fi

      - name: 清理控制字符并校验 YAML
        run: |
          python <<'PY'
          from pathlib import Path
          import sys
          import yaml

          src = Path("flclash-temp.yaml")
          cleaned_file = Path("flclash-temp-clean.yaml")

          def is_bad_control(ch):
              code = ord(ch)
              if ch in "\t\n\r":
                  return False
              return (
                  0x00 <= code <= 0x1F
                  or 0x7F <= code <= 0x9F
              )

          print("第一步：读取并清理原始文本")

          try:
              raw = src.read_text(encoding="utf-8")
          except Exception as e:
              print(f"文件不是有效 UTF-8：{e}")
              sys.exit(1)

          raw_bad_count = sum(
              1 for ch in raw if is_bad_control(ch)
          )

          if raw_bad_count:
              raw = "".join(
                  ch for ch in raw
                  if not is_bad_control(ch)
              )

          print(f"原始控制字符清理数量：{raw_bad_count}")

          print("第二步：解析 YAML")

          try:
              data = yaml.safe_load(raw)
          except Exception as e:
              print(f"YAML 解析失败：{e}")
              sys.exit(1)

          if not isinstance(data, dict):
              print("错误：YAML 顶层必须是字典")
              sys.exit(1)

          proxies = data.get("proxies")
          providers = data.get("proxy-providers")

          if not isinstance(proxies, list) and not isinstance(providers, dict):
              print("错误：未找到有效的 proxies 或 proxy-providers")
              sys.exit(1)

          if isinstance(proxies, list):
              print(f"检测到代理节点：{len(proxies)} 个")

          print("第三步：清理解析后字段中的控制字符")

          decoded_bad_count = 0

          def clean_string(value):
              global decoded_bad_count
              result = []

              for ch in value:
                  if is_bad_control(ch):
                      decoded_bad_count += 1
                  else:
                      result.append(ch)

              return "".join(result)

          def clean_obj(obj):
              if isinstance(obj, dict):
                  result = {}
                  for key, value in obj.items():
                      if isinstance(key, str):
                          key = clean_string(key)
                      result[key] = clean_obj(value)
                  return result

              if isinstance(obj, list):
                  return [clean_obj(item) for item in obj]

              if isinstance(obj, str):
                  return clean_string(obj)

              return obj

          data = clean_obj(data)

          print(f"解析后字段控制字符清理数量：{decoded_bad_count}")

          print("第四步：规范 HTTP Host 字段")

          fixed_host_count = 0

          for node in data.get("proxies", []):
              if not isinstance(node, dict):
                  continue

              http_opts = node.get("http-opts")
              if not isinstance(http_opts, dict):
                  continue

              headers = http_opts.get("headers")
              if not isinstance(headers, dict):
                  continue

              host = headers.get("Host")

              if isinstance(host, str):
                  headers["Host"] = [host]
                  fixed_host_count += 1

              elif isinstance(host, list):
                  # 已经是列表，无需修改
                  pass

          print(f"已规范 HTTP Host 字段：{fixed_host_count} 处")

          print("第五步：生成标准 YAML")

          try:
              yaml_text = yaml.safe_dump(
                  data,
                  allow_unicode=True,
                  sort_keys=False,
                  default_flow_style=False,
                  width=4096
              )
          except Exception as e:
              print(f"生成 YAML 失败：{e}")
              sys.exit(1)

          cleaned_file.write_text(yaml_text, encoding="utf-8")

          print("第六步：再次解析并验证")

          try:
              final_data = yaml.safe_load(
                  cleaned_file.read_text(encoding="utf-8")
              )
          except Exception as e:
              print(f"清理后的 YAML 解析失败：{e}")
              sys.exit(1)

          if not isinstance(final_data, dict):
              print("错误：最终 YAML 顶层不是字典")
              sys.exit(1)

          final_proxies = final_data.get("proxies")
          final_providers = final_data.get("proxy-providers")

          if not isinstance(final_proxies, list) and not isinstance(final_providers, dict):
              print("错误：最终配置没有有效代理节点或代理提供器")
              sys.exit(1)

          # 再次确认所有字符串中没有非法控制字符
          remaining = []

          def scan(obj, path="root"):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if isinstance(key, str) and any(
                          is_bad_control(ch) for ch in key
                      ):
                          remaining.append(f"{path}.KEY")
                      scan(value, f"{path}.{key}")

              elif isinstance(obj, list):
                  for i, value in enumerate(obj):
                      scan(value, f"{path}[{i}]")

              elif isinstance(obj, str):
                  if any(is_bad_control(ch) for ch in obj):
                      remaining.append(path)

          scan(final_data)

          if remaining:
              print("错误：最终配置仍存在控制字符")
              for item in remaining[:20]:
                  print(item)
              sys.exit(1)

          # 确认 Host 格式
          bad_host_count = 0

          for node in final_data.get("proxies", []):
              if not isinstance(node, dict):
                  continue

              http_opts = node.get("http-opts")
              if not isinstance(http_opts, dict):
                  continue

              headers = http_opts.get("headers")
              if not isinstance(headers, dict):
                  continue

              if "Host" in headers and not isinstance(headers["Host"], list):
                  bad_host_count += 1

          if bad_host_count:
              print(f"错误：仍有 {bad_host_count} 个 Host 字段格式不正确")
              sys.exit(1)

          # 检查通过后，才替换待更新文件
          cleaned_file.replace(src)

          print("================================")
          print("YAML 检查通过")
          print("非法控制字符：0")
          print("HTTP Host 字段格式检查通过")
          print("================================")
          PY

      - name: 更新固定配置文件
        run: |
          mv flclash-temp.yaml flclash.yaml

      - name: 记录更新时间和来源链接
        env:
          SUBSCRIPTION_URL: ${{ inputs.subscription_url }}
        run: |
          UPDATE_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')

          {
            echo "FlClash 节点更新记录"
            echo ""
            echo "最新更新时间：$UPDATE_TIME"
            echo "时区：北京时间"
            echo "本次来源链接：$SUBSCRIPTION_URL"
            echo "固定订阅地址：https://raw.githubusercontent.com/50lovelace/flclash-nodes/main/flclash.yaml"
            echo ""
            echo "更新前已执行控制字符清理、YAML 解析校验及 HTTP Host 字段格式检查"
          } > update-info.txt

      - name: 提交到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          UPDATE_DATE=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')

          git add flclash.yaml update-info.txt

          if git diff --cached --quiet; then
            echo "配置和记录没有变化，无需提交"
          else
            git commit -m "更新节点：$UPDATE_DATE"
            git push
          fi
